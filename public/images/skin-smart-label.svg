<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Ribbon body -->
  <path d="M10,0 L70,0 L70,95 L40,80 L10,95 Z" fill="url(#redGrad)" filter="url(#shadow)"/>
  <!-- Fold shadow -->
  <path d="M10,0 L70,0 L70,8 L10,8 Z" fill="#c62828" opacity="0.3"/>
  <!-- Checkmark circle -->
  <circle cx="40" cy="32" r="14" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <path d="M32,32 L38,38 L49,26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="40" y="56" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="7">SKIN SMART</text>
  <text x="40" y="66" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="6" opacity="0.85">APPROVED</text>
</svg>
